name: Atmospherics Fabric Refmap Repair V2

on:
  push:
    branches:
      - atmospherics-fabric-reupload
  workflow_dispatch:

permissions:
  contents: write

env:
  STATUS_FILE: .ci/atmospherics/refmap-v2-status.txt

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Publish active run ID
        run: |
          set -euo pipefail
          printf 'running\nrun=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$STATUS_FILE"
          git commit -m 'ci: publish active Atmospherics refmap repair run [skip ci]'
          git pull --rebase origin atmospherics-fabric-reupload
          git push origin HEAD:atmospherics-fabric-reupload

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate project and replace binary mixins with source mixins
        run: |
          set -euo pipefail
          python .ci/atmospherics/generate_port.py
          dst=.ci/atmospherics/work/src/main/java/com/beash/atmospherics/mixin
          mkdir -p "$dst"
          for f in AmbientFlowMixin BackgroundRendererMixin ClientWorldSkyColorMixin DimensionEffectsSunriseMixin LightningEntityRendererMixin WeatherSoundMixin WorldRendererSkyMixin; do
            cp ".ci/atmospherics/decompiled-mixins/$f.java" "$dst/$f.java"
          done
          python - <<'PY'
          from pathlib import Path
          root = Path('.ci/atmospherics/work')
          p = root / 'build.gradle'
          s = p.read_text(encoding='utf-8')
          old = "loom {\n    runs {"
          new = "loom {\n    mixin {\n        defaultRefmapName = 'atmospherics.refmap.json'\n    }\n\n    runs {"
          if old not in s:
              raise SystemExit('loom runs marker not found')
          s = s.replace(old, new, 1)
          old = "        exclude 'atmospherics.mixins.json'"
          new = old + "\n        exclude 'com/beash/atmospherics/mixin/**'"
          if old not in s:
              raise SystemExit('jar exclude marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          for java in (root / 'src/main/java/com/beash/atmospherics/mixin').glob('*.java'):
              t = java.read_text(encoding='utf-8')
              t = t.replace('cir.setReturnValue((Object)0);', 'cir.setReturnValue(0);')
              java.write_text(t, encoding='utf-8')
          PY

      - name: Compile production JAR
        working-directory: .ci/atmospherics/work
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean remapJar 2>&1 | tee ../refmap-v2-compile.log

      - name: Validate embedded production refmap
        working-directory: .ci/atmospherics/work
        run: |
          set -euo pipefail
          jar=build/libs/atmospherics-2.6.5-fabric-1.21.1.jar
          test -s "$jar"
          unzip -p "$jar" atmospherics.mixins.json > ../refmap-v2-mixins.json
          unzip -p "$jar" atmospherics.refmap.json > ../refmap-v2-refmap.json
          grep -F '"refmap": "atmospherics.refmap.json"' ../refmap-v2-mixins.json
          for selector in getSkyFlashTime setSkyFlashTime doAnimateTick renderSky setupColor setupFog; do
            grep -F "$selector" ../refmap-v2-refmap.json
          done
          python validate.py

      - name: Launch Fabric development client regression test
        working-directory: .ci/atmospherics/work
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1
          set -o pipefail
          timeout 300s xvfb-run -a gradle --no-daemon --stacktrace runClient 2>&1 | tee ../refmap-v2-client.log
          grep -F 'Atmospherics Fabric bridge initialized for Minecraft 1.21.1' run/logs/latest.log
          grep -F 'Atmospherics Fabric smoke test completed after 120 client ticks' run/logs/latest.log

      - name: Publish fixed JAR and diagnostics
        run: |
          set -euo pipefail
          out=.ci/atmospherics/refmap-v2-output
          rm -rf "$out"
          mkdir -p "$out"
          cp .ci/atmospherics/work/build/libs/atmospherics-2.6.5-fabric-1.21.1.jar "$out/atmospherics-2.6.5-fabric-1.21.1-refmapfix.jar"
          cp .ci/atmospherics/work/build/atmospherics-2.6.5-fabric-1.21.1-validation.txt "$out/validation.txt"
          cp .ci/atmospherics/refmap-v2-refmap.json "$out/atmospherics.refmap.json"
          (cd "$out" && sha256sum * > SHA256SUMS.txt)
          printf 'success\nrun=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$out" "$STATUS_FILE" .ci/atmospherics/refmap-v2-compile.log .ci/atmospherics/refmap-v2-mixins.json .ci/atmospherics/refmap-v2-refmap.json
          git commit -m 'ci: publish fixed Atmospherics Fabric refmap build [skip ci]'
          git pull --rebase origin atmospherics-fabric-reupload
          git push origin HEAD:atmospherics-fabric-reupload

      - name: Upload fixed JAR
        uses: actions/upload-artifact@v4
        with:
          name: atmospherics-fabric-1.21.1-refmapfix-v2
          path: .ci/atmospherics/refmap-v2-output/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish failure diagnostics
        if: failure()
        run: |
          set +e
          printf 'failure\nrun=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$STATUS_FILE" .ci/atmospherics/refmap-v2-compile.log .ci/atmospherics/refmap-v2-client.log .ci/atmospherics/refmap-v2-mixins.json .ci/atmospherics/refmap-v2-refmap.json
          git commit -m 'ci: publish Atmospherics refmap V2 failure diagnostics [skip ci]'
          git pull --rebase origin atmospherics-fabric-reupload
          git push origin HEAD:atmospherics-fabric-reupload
