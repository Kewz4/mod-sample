name: Atmospherics Decompile Mixins

on:
  push:
    branches:
      - atmospherics-fabric-reupload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download original mod and CFR
        run: |
          set -euo pipefail
          mkdir -p .ci/atmospherics/decompiler
          curl -fL --retry 3 -o .ci/atmospherics/decompiler/original.jar \
            'https://mediafilez.forgecdn.net/files/8394/888/atmospherics-2.6.5-mc-1.21.1.jar'
          curl -fL --retry 3 -o .ci/atmospherics/decompiler/cfr.jar \
            'https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar'
          echo '60d420dbdefd81894d509270d7577e865b49aa917eab5ad0a4806c80c215fe27  .ci/atmospherics/decompiler/original.jar' | sha256sum -c -

      - name: Decompile original mod
        run: |
          set -euo pipefail
          rm -rf .ci/atmospherics/decompiled-all .ci/atmospherics/decompiled-mixins
          java -jar .ci/atmospherics/decompiler/cfr.jar \
            .ci/atmospherics/decompiler/original.jar \
            --outputdir .ci/atmospherics/decompiled-all \
            --silent true \
            --caseinsensitivefs true
          mkdir -p .ci/atmospherics/decompiled-mixins
          cp -a .ci/atmospherics/decompiled-all/com/beash/atmospherics/mixin/. \
            .ci/atmospherics/decompiled-mixins/
          find .ci/atmospherics/decompiled-mixins -type f -maxdepth 2 -print

      - name: Publish decompiled mixins
        run: |
          set -euo pipefail
          rm -rf .ci/atmospherics/decompiler .ci/atmospherics/decompiled-all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .ci/atmospherics/decompiled-mixins
          git commit -m 'ci: publish decompiled Atmospherics mixins [skip ci]'
          git push origin HEAD:atmospherics-fabric-reupload
