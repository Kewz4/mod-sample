name: Story Mode Clouds 1.21.1 Compatibility Pack

on:
  push:
    branches:
      - atmospherics-fabric-reupload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download official Story Mode Clouds 1.3
        run: |
          set -euo pipefail
          rm -rf .ci/atmospherics/smc-work .ci/atmospherics/smc-output
          mkdir -p .ci/atmospherics/smc-work .ci/atmospherics/smc-output
          curl -fL --retry 3 \
            'https://cdn.modrinth.com/data/cIbVOeXJ/versions/ShzxIBqk/Story%20Mode%20Clouds.zip' \
            -o .ci/atmospherics/smc-work/original.zip
          unzip -q .ci/atmospherics/smc-work/original.zip -d .ci/atmospherics/smc-work/unpacked
          find .ci/atmospherics/smc-work/unpacked -type f -printf '%P\n' | sort \
            > .ci/atmospherics/smc-output/file-list.txt
          cp .ci/atmospherics/smc-work/unpacked/pack.mcmeta \
            .ci/atmospherics/smc-output/original-pack.mcmeta

      - name: Convert metadata for Minecraft 1.21.1
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.ci/atmospherics/smc-work/unpacked')
          path = root / 'pack.mcmeta'
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          pack = data.setdefault('pack', {})
          pack['pack_format'] = 34
          pack['supported_formats'] = {
              'min_inclusive': 34,
              'max_inclusive': 99,
          }
          pack['description'] = 'Story Mode Clouds 1.3 — Minecraft 1.21.1 compatibility build'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          cp .ci/atmospherics/smc-work/unpacked/pack.mcmeta \
            .ci/atmospherics/smc-output/converted-pack.mcmeta
          (
            cd .ci/atmospherics/smc-work/unpacked
            zip -qr ../../smc-output/Story-Mode-Clouds-1.3-MC-1.21.1.zip .
          )
          sha256sum .ci/atmospherics/smc-output/Story-Mode-Clouds-1.3-MC-1.21.1.zip \
            > .ci/atmospherics/smc-output/SHA256SUMS.txt
          printf 'success\nrun=%s\n' "$GITHUB_RUN_ID" > .ci/atmospherics/smc-status.txt

      - name: Publish converted pack and inspection data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .ci/atmospherics/smc-output .ci/atmospherics/smc-status.txt
          git commit -m 'ci: publish Story Mode Clouds 1.21.1 compatibility pack [skip ci]'
          git pull --rebase origin atmospherics-fabric-reupload
          git push origin HEAD:atmospherics-fabric-reupload

      - name: Upload converted pack
        uses: actions/upload-artifact@v4
        with:
          name: story-mode-clouds-1.21.1
          path: .ci/atmospherics/smc-output/*
          if-no-files-found: error
          retention-days: 7
