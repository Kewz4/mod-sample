name: Atmospherics Fabric 1.21.1 Republish

on:
  push:
    branches:
      - atmospherics-fabric-reupload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate compatibility-port sources
        run: python .ci/atmospherics/generate_port.py

      - name: Compile and remap production JAR
        working-directory: .ci/atmospherics/work
        run: gradle --no-daemon --stacktrace clean remapJar

      - name: Validate JAR structure and metadata
        working-directory: .ci/atmospherics/work
        run: python validate.py

      - name: Package files for download
        run: |
          set -euo pipefail
          OUT=.ci/atmospherics/output
          WORK=.ci/atmospherics/work
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$WORK/build/libs/atmospherics-2.6.5-fabric-1.21.1.jar" "$OUT/"
          cp "$WORK/build/atmospherics-2.6.5-fabric-1.21.1-validation.txt" "$OUT/"
          (
            cd "$WORK"
            zip -qr "../output/atmospherics-fabric-1.21.1-port-source.zip" \
              build.gradle gradle.properties settings.gradle \
              patch_private_descriptor.py validate.py src
          )
          (cd "$OUT" && sha256sum atmospherics-2.6.5-fabric-1.21.1.jar atmospherics-fabric-1.21.1-port-source.zip > SHA256SUMS.txt)
          ls -lah "$OUT"

      - name: Publish rebuilt files to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/atmospherics/output
          git commit -m "ci: republish Atmospherics Fabric 1.21.1 files [skip ci]"
          git push origin HEAD:atmospherics-fabric-reupload
