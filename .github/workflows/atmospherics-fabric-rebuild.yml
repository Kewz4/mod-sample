name: Atmospherics Fabric 1.21.1 Attachment Export

on:
  push:
    branches:
      - atmospherics-fabric-reupload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-attachment:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out published build
        uses: actions/checkout@v4

      - name: Verify published files
        run: |
          set -euo pipefail
          test -s .ci/atmospherics/output/atmospherics-2.6.5-fabric-1.21.1.jar
          test -s .ci/atmospherics/output/atmospherics-2.6.5-fabric-1.21.1-validation.txt
          sha256sum -c .ci/atmospherics/output/SHA256SUMS.txt

      - name: Upload downloadable attachment
        uses: actions/upload-artifact@v4
        with:
          name: atmospherics-fabric-1.21.1
          path: .ci/atmospherics/output/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish workflow run ID
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .ci/atmospherics/artifact-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/atmospherics/artifact-run-id.txt
          git commit -m "ci: publish Atmospherics attachment run ID [skip ci]"
          git push origin HEAD:atmospherics-fabric-reupload
